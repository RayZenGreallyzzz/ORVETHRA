name: ORVETHRA Animated Hero Android v0.8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout ORVETHRA
        uses: actions/checkout@v4
      - name: Verify committed Godot source
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/title_cover.jpg
          test -s scripts/main_menu.gd
          test -s scripts/town.gd
          test -s scripts/combat.gd
          test -s scenes/combat.tscn
          test -s scenes/city_preview.tscn
          test -s scripts/city_preview.gd
          test -s assets/characters/ORVETHRA_NeonAlleycat_Animated_Mobile.glb
          grep -q 'res://scenes/main_menu.tscn' project.godot
          echo "Verified ORVETHRA animated hero city test source"
          mkdir -p build
          if ! grep -q '^textures/vram_compression/import_etc2_astc=true' project.godot; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          fi
          if ! grep -q '^keystore/debug=' export_presets.cfg; then
            printf '\nkeystore/debug="/root/debug.keystore"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\n' >> export_presets.cfg
          fi
      - name: Setup Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/" || true
          fi
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/" || true
          fi
          godot --version
          ls -l /root/debug.keystore || true
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f | head -10 || true
      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Cannot open' build/import.log; then
            echo "Godot import or GDScript error"
            exit 1
          fi
      - name: Check city scene starts headlessly
        shell: bash
        run: |
          set -euo pipefail
          timeout 55 godot --headless --path . res://scenes/city_preview.tscn --quit-after 3 2>&1 | tee build/city-check.log
          if grep -E 'SCRIPT ERROR|Parse Error:|Invalid call|ERROR: Failed loading' build/city-check.log; then
            echo "City scene runtime error"
            exit 1
          fi
      - name: Export signed debug test APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path . --export-debug Android build/ORVETHRA-IT801C-debug.apk
          test -s build/ORVETHRA-IT801C-debug.apk
          ls -lh build/ORVETHRA-IT801C-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORVETHRA-Animated-Hero-v08-Android
          path: build/ORVETHRA-IT801C-debug.apk
          retention-days: 14
