name: ORVETHRA Android Debug v0.5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout ORVETHRA
        uses: actions/checkout@v4
      - name: Import complete ORVETHRA v0.5 source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ORVETHRA_v05_Source.zip ]; then
            echo "Importing complete ORVETHRA v0.5 street and approved menu artwork"
            unzip -oq ORVETHRA_v05_Source.zip -d .
          elif [ -f Aetherfall_Android_Build_Kit_v04.zip ]; then
            echo "Importing complete v0.4 street source package"
            unzip -oq Aetherfall_Android_Build_Kit_v04.zip -d .
            sed -i 's/Aetherfall | Android Test v0.4/ORVETHRA | Android Test v0.4/g; s/Aetherfall/ORVETHRA/g' project.godot
            sed -i 's@org.aetherfall.streettest@game.orvethra.test@g; s/package\/name="Aetherfall"/package\/name="ORVETHRA"/g' export_presets.cfg
          else
            echo "Building lightweight ORVETHRA repository test scene"
          fi
          mkdir -p build
          # Required by Android export even when runner imports using x86-64.
          if ! grep -q '^textures/vram_compression/import_etc2_astc=true' project.godot; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          fi
          # Works both with the tiny starter scene and with the full uploaded ZIP.
          if ! grep -q '^keystore/debug=' export_presets.cfg; then
            printf '\nkeystore/debug="/root/debug.keystore"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\n' >> export_presets.cfg
          fi
      - name: Setup Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/" || true
          fi
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/" || true
          fi
          godot --version
          ls -l /root/debug.keystore || true
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f | head -10 || true
      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Cannot open' build/import.log; then
            echo "Godot import or GDScript error"
            exit 1
          fi
      - name: Export unsigned release-style debug test APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path . --export-debug Android build/ORVETHRA-IT801C-debug.apk
          test -s build/ORVETHRA-IT801C-debug.apk
          ls -lh build/ORVETHRA-IT801C-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORVETHRA-v05-IT801C-debug
          path: build/ORVETHRA-IT801C-debug.apk
          retention-days: 14
